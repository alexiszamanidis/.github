name: Ansible Lint

on:
    workflow_call:
        inputs:
            python-version:
                description: Python version to use
                type: string
                default: "3.12"
            ansible-version:
                description: Ansible package version to install
                type: string
                default: "14.2.0"
            ansible-lint-version:
                description: ansible-lint package version to install
                type: string
                default: "25.7.0"
            config-file:
                description: Path to the ansible-lint config file
                type: string
                default: ./.ansible-lint
            install-galaxy:
                description: Install collections from requirements.yml
                type: boolean
                default: false
            requirements-file:
                description: Ansible Galaxy requirements file
                type: string
                default: requirements.yml
            use-vault:
                description: Write VAULT_PASSWORD to ~/.vault_pass.txt
                type: boolean
                default: false
            commit-message:
                description: Commit message used when lint --fix changes are applied
                type: string
                default: "feat(lint): apply linting changes"
        secrets:
            VAULT_PASSWORD:
                required: false

permissions:
    contents: write

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
                  persist-credentials: true

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install Ansible and ansible-lint
              run: python -m pip install ansible==${{ inputs.ansible-version }} ansible-lint==${{ inputs.ansible-lint-version }}

            - name: Write Ansible Vault password
              if: ${{ inputs.use-vault }}
              run: echo "${{ secrets.VAULT_PASSWORD }}" > "$HOME/.vault_pass.txt"
              shell: bash

            - name: Install Ansible Galaxy collections
              if: ${{ inputs.install-galaxy }}
              run: ansible-galaxy collection install -r ${{ inputs.requirements-file }}

            - name: Lint Ansible playbooks
              run: ansible-lint --fix -c ${{ inputs.config-file }}

            - name: Commit changes
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: ${{ inputs.commit-message }}
                  branch: ${{ github.head_ref || github.ref_name }}
